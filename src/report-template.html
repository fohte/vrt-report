<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual regression report</title>
    <style>
      __VRT_REPORT_STYLES__
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <strong>VRT</strong><span>Visual regression report</span>
      </div>
      <div class="summary" id="summary" aria-label="Change counts"></div>
      <div class="top-controls">
        <div
          class="filters"
          id="filters"
          role="group"
          aria-label="Filter changed stories"
        ></div>
        <div
          class="view-modes"
          id="view-modes"
          role="group"
          aria-label="Image comparison mode"
        ></div>
      </div>
    </header>
    <div class="workspace">
      <aside class="sidebar" aria-label="Story navigation">
        <label class="sr-only" for="story-search">Filter stories</label>
        <input
          class="search"
          id="story-search"
          type="search"
          placeholder="Filter stories"
          autocomplete="off"
        />
        <nav id="story-tree" aria-label="Changed stories by directory"></nav>
      </aside>
      <main class="main">
        <div class="list-toolbar">
          <span class="list-count" id="list-count"></span>
        </div>
        <section
          class="story-list"
          id="story-list"
          aria-label="Stories with visual changes"
        ></section>
      </main>
    </div>
    <dialog id="detail-dialog" aria-labelledby="detail-title">
      <div class="detail-head">
        <strong class="detail-title" id="detail-title"></strong>
        <span class="detail-variant" id="detail-variant"></span>
        <button
          class="detail-close"
          id="detail-close"
          type="button"
          aria-label="Close detail"
        >
          Close
        </button>
      </div>
      <div class="detail-content" id="detail-content"></div>
    </dialog>
    <script id="report-data" type="application/json">
      __VRT_REPORT_DATA__
    </script>
    <script>
      __VRT_REPORT_CLIENT__
    </script>
  </body>
</html>

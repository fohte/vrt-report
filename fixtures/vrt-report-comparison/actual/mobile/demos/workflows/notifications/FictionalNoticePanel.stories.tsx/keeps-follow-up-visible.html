<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Follow-up notice panel</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
        color: #e8eef4;
        background: #101820;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 30px;
      }
      main {
        width: min(100%, 960px);
        min-height: calc(100vh - 60px);
        margin: auto;
        padding: 28px;
        border: 1px solid #354653;
        border-radius: 18px;
        background: #182631;
      }
      .eyebrow {
        color: #9eb8c8;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 10px 0;
        font-size: 28px;
      }
      p {
        max-width: 720px;
        color: #b9c7d1;
        line-height: 1.55;
      }
      .notice {
        margin-top: 24px;
        padding: 18px;
        border: 1px solid #537064;
        border-radius: 12px;
        background: #1c352f;
      }
      .notice strong {
        display: block;
        margin-bottom: 8px;
        color: #bce5ce;
      }
      button {
        margin-top: 18px;
        padding: 10px 14px;
        border: 0;
        border-radius: 8px;
        background: #78b7a5;
        color: #10201c;
        font: inherit;
        font-weight: 700;
      }
      @media (max-width: 600px) {
        body {
          padding: 14px;
        }
        main {
          min-height: calc(100vh - 28px);
          padding: 18px;
        }
        h1 {
          font-size: 23px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Fictional notifications</div>
      <h1>Follow-up notice panel</h1>
      <p>
        A new review note arrives after the assignment has already been opened.
      </p>
      <div class="notice">
        <strong>Follow-up required</strong
        ><span>Read the updated routing note before continuing.</span>
      </div>
      <button type="button">Open review note</button>
    </main>
  </body>
</html>

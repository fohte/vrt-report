<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Retired archive state</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
        color: #e8eef4;
        background: #101820;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 30px;
      }
      main {
        width: min(100%, 960px);
        min-height: calc(100vh - 60px);
        margin: auto;
        padding: 28px;
        border: 1px solid #354653;
        border-radius: 18px;
        background: #182631;
      }
      .eyebrow {
        color: #9eb8c8;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 10px 0;
        font-size: 28px;
      }
      p {
        max-width: 720px;
        color: #b9c7d1;
        line-height: 1.55;
      }
      .badge {
        display: inline-block;
        margin-top: 18px;
        padding: 10px 14px;
        border: 1px solid #536d7c;
        border-radius: 10px;
        background: #1d303c;
        color: #b9c7d1;
      }
      @media (max-width: 600px) {
        body {
          padding: 14px;
        }
        main {
          min-height: calc(100vh - 28px);
          padding: 18px;
        }
        h1 {
          font-size: 23px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Fictional archive</div>
      <h1>Archived state</h1>
      <p>
        This state remains in the previous snapshot so the report can show which
        archived preview was removed from the current set.
      </p>
      <div class="badge">Retired</div>
    </main>
  </body>
</html>
